server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:9090}
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_officeclockinout_sys?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 5MB
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
sa-token:
  token-name: Authorization
  timeout: 7200
  is-concurrent: true
  is-share: false
  is-read-cookie: false
  is-log: false
  token-prefix: Bearer
  jwt-secret-key: ${JWT_SECRET}
app:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  registration-enabled: ${REGISTRATION_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:7000,http://127.0.0.1:7000}
face:
  enabled: ${FACE_ENABLED:true}
  provider: ${FACE_PROVIDER:local}
  template-key: ${FACE_TEMPLATE_KEY:}
  local:
    url: ${FACE_LOCAL_URL:http://127.0.0.1:8010}
    token: ${FACE_INTERNAL_TOKEN:}
    threshold: ${FACE_LOCAL_THRESHOLD:0.45}
  secret-id: ${TENCENT_SECRET_ID:}
  secret-key: ${TENCENT_SECRET_KEY:}
  region: ${TENCENT_REGION:ap-shanghai}
  threshold: ${FACE_THRESHOLD:80}
file:
  storage-path: ${FILE_STORAGE_PATH:./files}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:9090}
attendance:
  report:
    scheduling-enabled: ${REPORT_SCHEDULING_ENABLED:true}
    max-active-jobs: ${REPORT_MAX_ACTIVE_JOBS:3}
