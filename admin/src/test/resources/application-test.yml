spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:foundation;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=MONTH
    username: sa
    password:
  sql:
    init:
      mode: always
sa-token:
  jwt-secret-key: test-only-signing-key-not-for-deployment-0123456789
face:
  enabled: false
app:
  registration-enabled: false
file:
  storage-path: ./target/test-files
attendance:
  report:
    scheduling-enabled: false
    max-active-jobs: 3
