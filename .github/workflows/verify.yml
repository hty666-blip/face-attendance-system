name: Verify
on: [push, pull_request]
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          # 仅此无数据、无端口映射的 CI 临时容器使用，不是真实凭据。
          MYSQL_ROOT_PASSWORD: ci-only-migration-test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Verify clean schema and V003-V005 upgrade
        env:
          MYSQL_TEST_CONTAINER: ${{ job.services.mysql.id }}
        run: bash database/tests/verify-migrations.sh "$MYSQL_TEST_CONTAINER"
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: node --test
      - run: npm run build
  face-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m pytest -q ../scripts/demo/test_seed_data.py
  demo-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows PowerShell 5.1 demo safety
        shell: powershell
        run: ./scripts/tests/demo-safety.test.ps1
      - name: Verify PowerShell 7 demo safety
        shell: pwsh
        run: ./scripts/tests/demo-safety.test.ps1
